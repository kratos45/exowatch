services:
  streamlit:
    build: .
    container_name: exowatch_streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: streamlit run src/app.py --server.address=0.0.0.0 --server.port=8501
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///data/curated/neo_curated.db
      - NASA_API_KEY=DEMO_KEY

  api:
    build: .
    container_name: exowatch_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///data/curated/neo_curated.db

  frontend:
    build: ./frontend
    container_name: exowatch_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
